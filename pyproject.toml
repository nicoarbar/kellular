[project]
name = "kellular"
version = "0.0.1"
description = "Tumor digital twin for metastatic colorectal cancer: profile, predict, design, validate."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
omics = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "pandas>=2.2",
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kellular"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

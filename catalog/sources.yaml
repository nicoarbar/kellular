# Machine-readable registry of external data sources (see docs/DATA_SOURCES.md for the readable view).
#
# Rules (openspec/changes/phase-0-foundation/specs/data-catalog/spec.md):
#   - A source must be registered here before ingestion.
#   - Ingestion refuses any source whose license_status is `unverified`.
#   - Licenses and citations below are PROVISIONAL, recorded before checking the owners' official
#     terms. Task 3.1 confirms each one; only then flip license_status to `verified`.
#   - `name` must match the first column of the tables in docs/DATA_SOURCES.md exactly.
#
# access:        open | controlled
# redistribution: allowed | forbidden | unknown
# license_status: verified | unverified

sources:
  # ---- Patient cohorts ----------------------------------------------------------------------
  - id: tcga-coad-read
    name: TCGA COAD/READ (GDC)
    owner: National Cancer Institute (Genomic Data Commons)
    url: https://portal.gdc.cancer.gov/
    license: NIH GDC open-access terms (no explicit open license stated)
    citation: "Cancer Genome Atlas Network. Comprehensive molecular characterization of human colon and rectal cancer. Nature 487, 330-337 (2012)."
    access: open
    redistribution: unknown
    license_status: unverified
    notes: >-
      Audit 2026-10-03. GDC policy: acknowledge the dataset and repository in publications; do not
      re-identify participants; no explicit license or redistribution rule on the policy page.
      Individual-level sequence and germline data are controlled (dbGaP). cBioPortal study
      coadread_tcga_pan_can_atlas_2018: 594 patients, mostly primary tumors, 86 stage IV; treatment
      events for 214 patients (5-FU, oxaliplatin, bevacizumab, ...); expression, CNA, methylation,
      RPPA; no metastatic-site attribute; per-line response not found (STATUS events not inspected).
      Not suitable as the benchmark cohort.

  - id: cptac-colon
    name: CPTAC colon (PDC)
    owner: National Cancer Institute (CPTAC, Proteomic Data Commons)
    url: https://pdc.cancer.gov/
    license: CPTAC responsible-use principles and publication guidelines
    citation: "Vasaikar S, et al. Proteogenomic analysis of human colon cancer reveals new therapeutic opportunities. Cell 177, 1035-1049 (2019)."
    access: open
    redistribution: unknown
    license_status: unverified
    notes: >-
      Audit 2026-10-03. The PDC policy page could not be read (JavaScript-rendered). The terms here
      come from a search result about the CPTAC data portal: follow the Fort Lauderdale/Amsterdam
      responsible-use principles and CPTAC publication guidelines, and include the statement "Data
      used in this publication were generated by the National Cancer Institute Clinical Proteomic
      Tumor Analysis Consortium (CPTAC)". Confirm on the PDC itself. Cohort is about 110 patients
      (about 79 with clinical outcomes), primary tumors. Useful for proteomics, too small for the
      benchmark.

  - id: msk-chord
    name: MSK-CHORD (cBioPortal)
    owner: Memorial Sloan Kettering Cancer Center
    url: https://www.cbioportal.org/
    license: CC BY-NC-ND 4.0
    citation: "Jee J, et al. Automated real-world data integration improves cancer outcome prediction. Nature 636, 728-736 (2024)."
    access: open
    redistribution: forbidden
    license_status: unverified
    notes: >-
      Audit 2026-10-03, from the cBioPortal API (study msk_chord_2024, public study). The study
      description states CC BY-NC-ND 4.0 and says commercial use requires contacting
      datarequests@mskcc.org. NonCommercial and NoDerivatives conflict with commercial plans and with
      redistributing derived datasets; needs a decision before use (see docs/ROADMAP.md licensing).
      Content: 24,950 patients pan-cancer, 5,543 colorectal; MSK-IMPACT panel (mutations, CNA,
      structural variants; no expression); patient-level LIVER and LUNG metastasis flags among
      colorectal patients: liver 3,114, lung 2,817, both 2,198, stage 4 in 2,372; HER2, MSI score,
      OS_MONTHS and OS_STATUS; treatment timeline with agents and start/end days (39 of 40 sampled
      liver/lung colorectal patients had treatment events). No per-line response or progression
      attribute seen. Treatment is timed from diagnosis, so sample-before-treatment needs checking
      in task 3.2.

  - id: msk-met
    name: MSK-MET (cBioPortal)
    owner: Memorial Sloan Kettering Cancer Center
    url: https://www.cbioportal.org/
    license: CC BY-NC-ND 4.0
    citation: "Nguyen B, et al. Genomic characterization of metastatic patterns from prospective clinical sequencing of 25,000 patients. Cell 185, 563-575 (2022)."
    access: open
    redistribution: forbidden
    license_status: unverified
    notes: >-
      Audit 2026-10-03, from the cBioPortal API (study msk_met_2021, public study). Study description
      states CC BY-NC-ND 4.0 (same NonCommercial/NoDerivatives caveat as MSK-CHORD). 25,775 samples,
      3,548 colorectal patients; MSK-IMPACT panel; per-site distant-metastasis flags (DMETS_DX_LIVER,
      DMETS_DX_LUNG, ...) and OS. Timeline has only diagnosis, surgery, sequencing and status events,
      with no treatment events, so it cannot support response prediction on its own.

  - id: aacr-genie
    name: AACR Project GENIE (incl. BPC CRC)
    owner: American Association for Cancer Research
    url: https://www.aacr.org/professionals/research/aacr-project-genie/
    license: AACR GENIE terms of access
    citation: "AACR Project GENIE Consortium. AACR Project GENIE: powering precision medicine through an international consortium. Cancer Discovery 7, 818-831 (2017)."
    access: controlled
    redistribution: forbidden
    license_status: unverified
    notes: >-
      Audit 2026-10-03. Access: create an account on Synapse or cBioPortal and accept the terms of
      access; no application review is described for the public releases (so recorded as
      controlled-by-registration). Terms, from a search-result summary of AACR's terms and not yet read
      on the Synapse page: do not identify or contact participants; do not redistribute without written
      permission from the GENIE Coordinating Center. BPC CRC v2.0-public (released 2022): 1,485
      colorectal patients from MSKCC, DFCI and VICC; every systemic regimen with dates; imaging-based
      response/progression (rwPFS, rwOS, time to treatment discontinuation); panel sequencing 2014-2018,
      no expression. The PRISSMM curation framework is for research use only, and PRISSMM licensing
      questions go to PRISSMM@mskcc.org. Best fit so far for a response benchmark; the exact license
      and the metastatic-site annotation still need confirming on Synapse.

